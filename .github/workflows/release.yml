# Shared release pipeline for all PlanetesLAB crates/packages.
#
# Called from each repo (see callers/). What it does:
#   * reads the version from a manifest (Cargo.toml or pyproject.toml)
#   * compares it with the existing tags that share a prefix
#   * on every run (push or PR): fails if the version is not the same as the latest tag or one of
#     the three valid semver increments of it (patch / minor / major)
#   * on a push to the release branch where the version is a valid increase: runs the checks,
#     creates the annotated tag and the GitHub Release (notes = commit subjects since the previous tag)
#   * after a release, optionally: builds the executable for linux-x86_64 (manylinux_2_28) and
#     macos-arm64 and packs a resources folder, and attaches them to the Release
# It never looks at commit messages, so any commit style works.
name: release

on:
  workflow_call:
    inputs:
      manifest:
        description: "Path to Cargo.toml or pyproject.toml holding the version"
        type: string
        default: Cargo.toml
      tag-prefix:
        description: "Tag prefix, e.g. v, sundials-v, scorpia-py-v"
        type: string
        default: v
      release-branch:
        description: "Branch that creates releases (default: the repository's default branch)"
        type: string
        default: ""
      test-command:
        description: "Run before releasing. Empty skips. Default is for Rust crates."
        type: string
        default: "cargo test --locked"
      apt-packages:
        description: "Space separated apt packages to install first"
        type: string
        default: ""
      submodules:
        type: boolean
        default: false
      setup-uv:
        description: "Install uv (for Python packages)"
        type: boolean
        default: false
      binaries:
        description: "After a release, build the executable named like the repo for linux-x86_64 and macos-arm64 and attach <repo>-<version>-<platform>.tar.gz"
        type: boolean
        default: false
      build-env:
        description: "Environment for the release build of the binaries, e.g. SCORPIA_RELEASE_BUILD=1"
        type: string
        default: ""
      build-args:
        description: "Extra cargo build arguments for the binaries, e.g. --features analysis,tui"
        type: string
        default: ""
      linux-packages:
        description: "dnf arguments for the manylinux_2_28 build of the binaries, e.g. --enablerepo=powertools clang-devel"
        type: string
        default: ""
      resources:
        description: "After a release, attach this folder as <repo>-resources-<version>.tar.gz (empty: none)"
        type: string
        default: ""
      resources-exclude:
        description: "Space separated paths inside the resources archive to leave out, e.g. resources/big"
        type: string
        default: ""
    secrets:
      DEPS_TOKEN:
        description: "Fine-grained token with read access to the private repos used as git dependencies"
        required: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}-${{ inputs.tag-prefix }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.ver.outputs.release }}
      tag: ${{ steps.ver.outputs.tag }}
      version: ${{ steps.ver.outputs.version }}
    env:
      MANIFEST: ${{ inputs.manifest }}
      PREFIX: ${{ inputs.tag-prefix }}
      GH_TOKEN: ${{ github.token }}
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      DEPS_TOKEN: ${{ secrets.DEPS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
          submodules: ${{ inputs.submodules }}

      - name: Let git reach private dependencies
        if: ${{ env.DEPS_TOKEN != '' }}
        run: |
          git config --global url."https://x-access-token:${DEPS_TOKEN}@github.com/".insteadOf "https://github.com/"
          git config --global --add url."https://x-access-token:${DEPS_TOKEN}@github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://x-access-token:${DEPS_TOKEN}@github.com/".insteadOf "git@github.com:"

      - name: Check the version
        id: ver
        shell: python
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          RELEASE_BRANCH: ${{ inputs.release-branch || github.event.repository.default_branch }}
          SHA: ${{ github.sha }}
        run: |
          import os, re, subprocess, sys, tomllib
          from pathlib import Path

          def fail(msg):
              print(f"::error::{msg}")
              sys.exit(1)

          def sh(*a):
              return subprocess.run(a, capture_output=True, text=True)

          manifest = Path(os.environ["MANIFEST"])
          prefix = os.environ["PREFIX"]
          if not manifest.exists():
              fail(f"{manifest} not found")
          data = tomllib.loads(manifest.read_text())
          pkg = data.get("package") or data.get("project") or fail(f"{manifest} has no [package]/[project]")
          version = pkg.get("version")
          if isinstance(version, dict) and version.get("workspace"):
              for d in [manifest.parent.resolve(), *manifest.parent.resolve().parents]:
                  root = d / "Cargo.toml"
                  if root.exists():
                      ws = tomllib.loads(root.read_text()).get("workspace", {}).get("package", {})
                      if "version" in ws:
                          version = ws["version"]
                          break
          if not isinstance(version, str):
              fail(f"{manifest}: version is missing, dynamic or not a plain string")
          m = re.fullmatch(r"(\d+)\.(\d+)\.(\d+)", version)
          if not m:
              fail(f"version '{version}' is not plain MAJOR.MINOR.PATCH")
          new = tuple(map(int, m.groups()))

          pat = re.compile(re.escape(prefix) + r"(\d+)\.(\d+)\.(\d+)")
          tags = {}
          for t in sh("git", "tag", "-l", f"{prefix}*").stdout.split():
              mt = pat.fullmatch(t)
              if mt:
                  tags[tuple(map(int, mt.groups()))] = t
          latest = max(tags) if tags else None
          tag = f"{prefix}{version}"

          release = False
          tag_exists = False
          prev_tag = ""
          note = ""
          if latest is None:
              release, note = True, f"first release {tag}"
          else:
              prev_tag = tags[latest]
              if sh("git", "merge-base", "--is-ancestor", prev_tag, "HEAD").returncode != 0:
                  fail(f"latest tag {prev_tag} is not in the history of this commit")
              a, b, c = latest
              allowed = [(a, b, c + 1), (a, b + 1, 0), (a + 1, 0, 0)]
              if new == latest:
                  note = f"version {version} unchanged since {prev_tag}: no release"
                  tag_exists = True
                  # recovery: tag is on this very commit but its GitHub Release is missing
                  tagsha = sh("git", "rev-parse", f"{prev_tag}^{{commit}}").stdout.strip()
                  if tagsha == os.environ["SHA"] and sh("gh", "release", "view", prev_tag).returncode != 0:
                      release, note = True, f"{prev_tag} has no GitHub Release yet: creating it"
              elif new in allowed:
                  release, note = True, f"{prev_tag} -> {tag}"
              else:
                  ok = ", ".join(".".join(map(str, x)) for x in allowed)
                  if new < latest:
                      fail(f"version {version} goes backwards from {prev_tag}. Allowed next versions: {ok}, or keep {'.'.join(map(str, latest))}")
                  fail(f"version {version} skips from {prev_tag}. Allowed next versions: {ok}")

          on_branch = os.environ["EVENT"] == "push" and os.environ["REF"] == f"refs/heads/{os.environ['RELEASE_BRANCH']}"
          do_release = release and on_branch
          if release and not on_branch:
              note += " (valid; will be released when it lands on " + os.environ["RELEASE_BRANCH"] + ")"
          print(note)
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"version={version}\ntag={tag}\nprev_tag={prev_tag}\nrelease={'true' if do_release else 'false'}\n")
              f.write(f"tag_exists={'true' if tag_exists else 'false'}\nprerelease={'true' if new[0] == 0 else 'false'}\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(f"### {tag}\n{note}\n")

      - name: Install system packages
        if: ${{ inputs.apt-packages != '' && (steps.ver.outputs.release == 'true' || github.event_name == 'pull_request') }}
        run: sudo apt-get update && sudo apt-get install -y ${{ inputs.apt-packages }}

      - uses: dtolnay/rust-toolchain@stable
        if: ${{ endsWith(inputs.manifest, 'Cargo.toml') }}
      - uses: Swatinem/rust-cache@v2
        if: ${{ endsWith(inputs.manifest, 'Cargo.toml') }}
      - uses: astral-sh/setup-uv@v5
        if: ${{ inputs.setup-uv }}

      - name: Cargo.lock is in sync with the manifest
        if: ${{ endsWith(inputs.manifest, 'Cargo.toml') }}
        run: cargo metadata --locked --format-version 1 --manifest-path "$MANIFEST" > /dev/null

      - name: Tests
        if: ${{ inputs.test-command != '' && (steps.ver.outputs.release == 'true' || github.event_name == 'pull_request') }}
        run: ${{ inputs.test-command }}

      - name: Tag and release
        if: ${{ steps.ver.outputs.release == 'true' }}
        env:
          TAG: ${{ steps.ver.outputs.tag }}
          PREV: ${{ steps.ver.outputs.prev_tag }}
          TAG_EXISTS: ${{ steps.ver.outputs.tag_exists }}
          PRERELEASE: ${{ steps.ver.outputs.prerelease }}
        run: |
          set -euo pipefail
          dir="$(dirname "$MANIFEST")"
          if [ "$TAG_EXISTS" != "true" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" "$GITHUB_SHA" -m "${GITHUB_REPOSITORY#*/} $TAG

          Created by the release workflow from commit ${GITHUB_SHA:0:7}."
            git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "refs/tags/$TAG"
          fi
          range="${PREV:+$PREV..}$TAG"
          { if [ -n "$PREV" ]; then echo "Changes since $PREV:"; else echo "First release."; fi
            echo
            git log --no-merges --format="- %s ([%h](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/%H))" "$range" -- "$dir"
          } > notes.md
          flags=(--verify-tag --title "$TAG" --notes-file notes.md)
          [ "$PRERELEASE" = true ] && flags+=(--prerelease)
          [ "$PREFIX" = v ] && flags+=(--latest) || flags+=(--latest=false)
          gh release create "$TAG" "${flags[@]}"

  binaries:
    needs: release
    if: ${{ inputs.binaries && needs.release.outputs.release == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-latest
            container: quay.io/pypa/manylinux_2_28_x86_64
          - platform: macos-arm64
            runner: macos-14
            container: ""
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    env:
      NAME: ${{ github.event.repository.name }}
      VERSION: ${{ needs.release.outputs.version }}
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      DEPS_TOKEN: ${{ secrets.DEPS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}
          persist-credentials: false
          submodules: ${{ inputs.submodules }}

      - name: Let git reach private dependencies
        if: ${{ env.DEPS_TOKEN != '' }}
        run: |
          git config --global url."https://x-access-token:${DEPS_TOKEN}@github.com/".insteadOf "https://github.com/"
          git config --global --add url."https://x-access-token:${DEPS_TOKEN}@github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://x-access-token:${DEPS_TOKEN}@github.com/".insteadOf "git@github.com:"

      - name: Install system packages (Linux)
        if: ${{ matrix.container != '' && inputs.linux-packages != '' }}
        run: dnf install -y ${{ inputs.linux-packages }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: env ${{ inputs.build-env }} cargo build --release --locked ${{ inputs.build-args }}

      - name: Check the executable
        run: |
          "./target/release/$NAME" --version
          if [ "$(uname)" = Linux ]; then ldd "target/release/$NAME"; else otool -L "target/release/$NAME"; fi

      - name: Pack
        run: tar -czf "$NAME-$VERSION-${{ matrix.platform }}.tar.gz" -C target/release "$NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: "*.tar.gz"

  assets:
    needs: [release, binaries]
    if: ${{ !cancelled() && needs.release.outputs.release == 'true' && needs.binaries.result != 'failure' && (inputs.binaries || inputs.resources != '') }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      NAME: ${{ github.event.repository.name }}
      VERSION: ${{ needs.release.outputs.version }}
      TAG: ${{ needs.release.outputs.tag }}
      RESOURCES: ${{ inputs.resources }}
      EXCLUDE: ${{ inputs.resources-exclude }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}
          persist-credentials: false

      - uses: actions/download-artifact@v4
        if: ${{ inputs.binaries }}
        with:
          path: dist
          merge-multiple: true

      - name: Pack the resources
        if: ${{ inputs.resources != '' }}
        run: |
          set -euo pipefail
          mkdir -p dist
          excludes=(--exclude=.DS_Store)
          for path in $EXCLUDE; do excludes+=("--exclude=$path"); done
          tar -czf "dist/$NAME-resources-$VERSION.tar.gz" "${excludes[@]}" \
            -C "$(dirname "$RESOURCES")" "$(basename "$RESOURCES")"

      - name: Attach to the release
        run: |
          set -euo pipefail
          ls -l dist
          gh release upload "$TAG" dist/*.tar.gz --clobber

